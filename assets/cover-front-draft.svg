<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" width="1600" height="2400">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#141E30" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0F1117" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#08090C" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="45%" stop-color="#CBD5E0"/>
      <stop offset="50%" stop-color="#F7FAFC"/>
      <stop offset="55%" stop-color="#A0AEC0"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>

    <linearGradient id="bladeRuneGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>

    <linearGradient id="steelWrench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5568"/>
      <stop offset="30%" stop-color="#CBD5E0"/>
      <stop offset="70%" stop-color="#718096"/>
      <stop offset="100%" stop-color="#2D3748"/>
    </linearGradient>

    <linearGradient id="leatherWrap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2C1810"/>
      <stop offset="30%" stop-color="#5C3826"/>
      <stop offset="70%" stop-color="#3D2314"/>
      <stop offset="100%" stop-color="#1F1008"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365"/>
      <stop offset="100%" stop-color="#FDA085"/>
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Industrial Grid Pattern -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1600" height="2400" fill="#0A0B0E"/>
  <rect width="1600" height="2400" fill="url(#bgGlow)"/>
  <rect width="1600" height="2400" fill="url(#grid)"/>

  <!-- Subtle Atmospheric Spark Rings -->
  <circle cx="800" cy="1250" r="480" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="8 24" stroke-opacity="0.25"/>
  <circle cx="800" cy="1250" r="540" fill="none" stroke="#FDA085" stroke-width="1" stroke-dasharray="4 32" stroke-opacity="0.2"/>

  <!-- ==================== CENTRAL WEAPON ARTIFACT ==================== -->
  <g id="plumber-kunai-artifact" filter="url(#shadowHeavy)">

    <!-- BACKDROP BLUE CORE AURA -->
    <ellipse cx="800" cy="1220" rx="140" ry="420" fill="#00F2FE" opacity="0.12" filter="blur(50px)"/>

    <!-- 1. KUNAI BLADE (DIAMOND SHAPE) -->
    <!-- Outer Blade Edge -->
    <polygon points="800,480 910,1180 800,1280 690,1180" fill="url(#bladeGrad)" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Left Blade Bevel Shadow -->
    <polygon points="800,480 690,1180 800,1280" fill="#1A202C" opacity="0.45"/>

    <!-- Central Ridge Line (High Polish Spine) -->
    <line x1="800" y1="480" x2="800" y2="1280" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>

    <!-- 2. ASSASSIN CREST EMBOSSED FULLER -->
    <polygon points="800,640 835,1120 800,1160 765,1120" fill="#0D1117" stroke="#4A5568" stroke-width="1.5"/>
    <!-- Triangular Assassin Glyph Apex -->
    <polygon points="800,700 820,860 800,830 780,860" fill="none" stroke="#CBD5E0" stroke-width="2" opacity="0.75"/>
    <circle cx="800" cy="770" r="6" fill="#00F2FE" filter="url(#neonGlow)"/>

    <!-- 3. WITCHER ALCHEMICAL & CIRCUIT RUNES (GLOWING CYAN) -->
    <g id="glowing-runes" filter="url(#neonGlow)" stroke="#00F2FE" stroke-width="2.5" fill="none" stroke-linecap="round">
      <!-- Ground Glyph ⏚ -->
      <line x1="800" y1="890" x2="800" y2="920"/>
      <line x1="785" y1="920" x2="815" y2="920"/>
      <line x1="790" y1="926" x2="810" y2="926"/>
      <line x1="795" y1="932" x2="805" y2="932"/>

      <!-- Alchemical Sign Quen (Shield / Hydraulic Gate) -->
      <path d="M 790,960 L 800,945 L 810,960 L 800,975 Z"/>
      <line x1="800" y1="975" x2="800" y2="995"/>

      <!-- Pressure Diode Symbol -->
      <polygon points="792,1010 808,1010 800,1025" fill="#00F2FE" opacity="0.6"/>
      <line x1="792" y1="1025" x2="808" y2="1025"/>

      <!-- Check Valve Glyphs (Alchemical Igni / Fire Core) -->
      <path d="M 788,1045 L 800,1065 L 812,1045"/>
      <circle cx="800" cy="1090" r="8"/>
      <line x1="800" y1="1082" x2="800" y2="1098"/>
      <line x1="792" y1="1090" x2="808" y2="1090"/>
    </g>

    <!-- 4. HILT / GUARD (ASSASSIN BRACER MECHANICAL INTEGRATION) -->
    <!-- Crossguard Fittings -->
    <rect x="740" y="1275" width="120" height="22" rx="4" fill="url(#steelWrench)" stroke="#1A202C" stroke-width="2"/>
    <circle cx="755" cy="1286" r="4" fill="#E2E8F0"/>
    <circle cx="845" cy="1286" r="4" fill="#E2E8F0"/>
    <!-- Mechanical Sliding Rails -->
    <line x1="770" y1="1297" x2="770" y2="1520" stroke="#718096" stroke-width="3"/>
    <line x1="830" y1="1297" x2="830" y2="1520" stroke="#718096" stroke-width="3"/>

    <!-- 5. LEATHER WRAPPED HANDLE -->
    <!-- Handle Core -->
    <rect x="765" y="1295" width="70" height="230" fill="#1A100A"/>
    <!-- Leather Straps Overlap (Tsuka-ito / Assassin bracer wrap) -->
    <g fill="url(#leatherWrap)" stroke="#170D07" stroke-width="2">
      <path d="M 765,1300 L 835,1335 L 835,1355 L 765,1320 Z"/>
      <path d="M 835,1340 L 765,1375 L 765,1395 L 835,1360 Z"/>
      <path d="M 765,1380 L 835,1415 L 835,1435 L 765,1400 Z"/>
      <path d="M 835,1420 L 765,1455 L 765,1475 L 835,1440 Z"/>
      <path d="M 765,1460 L 835,1495 L 835,1515 L 765,1480 Z"/>
    </g>

    <!-- 6. POMMEL: 32MM BOX-END PIPE WRENCH (НАКИДНОЙ КЛЮЧ НА 32) -->
    <g id="wrench-32-pommel" transform="translate(800, 1630)">
      <!-- Wrench Neck / Collar -->
      <rect x="-24" y="-115" width="48" height="35" rx="3" fill="url(#steelWrench)" stroke="#2D3748" stroke-width="2"/>
      <path d="M -24,-80 L -38,-50 L 38,-50 L 24,-80 Z" fill="url(#steelWrench)"/>

      <!-- Outer Heavy Wrench Ring -->
      <circle cx="0" cy="0" r="95" fill="url(#steelWrench)" stroke="#1A202C" stroke-width="3"/>
      
      <!-- Inner Beveled Ring -->
      <circle cx="0" cy="0" r="75" fill="#2D3748"/>

      <!-- 12-Point Hex Star Wrench Teeth (Разводные шлицы накидного ключа) -->
      <path d="
        M 0,-62 L 15,-50 L 34,-54 L 43,-38 L 60,-32 L 60,-15 L 68,0 L 60,15 L 60,32 L 43,38 L 34,54 L 15,50 
        L 0,62 L -15,50 L -34,54 L -43,38 L -60,32 L -60,15 L -68,0 L -60,-15 L -60,-32 L -43,-38 L -34,-54 L -15,-50 Z
      " fill="#0A0D12" stroke="#4A5568" stroke-width="1.5"/>

      <!-- Embossed Metric Caliber "32" Engraving -->
      <text x="0" y="8" font-family="'Courier New', monospace" font-size="28" font-weight="900" fill="#E2E8F0" text-anchor="middle" letter-spacing="2">32</text>
      <text x="0" y="-76" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#CBD5E0" text-anchor="middle" letter-spacing="3">CR-V</text>
    </g>

  </g>

  <!-- ==================== TYPOGRAPHY & COVER LAYOUT ==================== -->
  
  <!-- TOP BRANDING & APEX BADGE -->
  <g text-anchor="middle">
    <!-- Sovereign Monograph Tag -->
    <rect x="580" y="160" width="440" height="36" rx="18" fill="#1A202C" stroke="#4A5568" stroke-width="1"/>
    <text x="800" y="184" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#00F2FE" letter-spacing="4">SYSTEM PROMPT FOR HUMANS</text>

    <!-- MAIN TITLE: САНТЕХНИКА БЫТИЯ -->
    <text x="800" y="300" font-family="'Impact', 'Arial Black', sans-serif" font-size="94" font-weight="900" fill="#FFFFFF" letter-spacing="4">САНТЕХНИКА БЫТИЯ</text>
    <text x="800" y="300" font-family="'Impact', 'Arial Black', sans-serif" font-size="94" font-weight="900" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.6" letter-spacing="4">САНТЕХНИКА БЫТИЯ</text>

    <!-- SUBTITLE -->
    <text x="800" y="360" font-family="'PT Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#CBD5E0" letter-spacing="4">АРХИТЕКТУРА СУВЕРЕНИТЕТА, ТЕЛЕМЕТРИИ И ВЫЖИВАНИЯ</text>
    <text x="800" y="395" font-family="'PT Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#718096" letter-spacing="3">В ЭПОХУ ЦИФРОВОГО ХАОСА</text>

    <!-- SAKURA & SASUKE SUBTITLE BADGE -->
    <text x="800" y="445" font-family="'Georgia', serif" font-size="19" font-style="italic" fill="#FDA085" letter-spacing="2">«Папин бумер, мамин Саске-кун»</text>
  </g>

  <!-- BOTTOM AUTHOR & TECH CREDENTIALS -->
  <g text-anchor="middle">
    <!-- Division line -->
    <line x1="450" y1="2100" x2="1150" y2="2100" stroke="#2D3748" stroke-width="1"/>
    <circle cx="800" cy="2100" r="5" fill="#00F2FE"/>

    <!-- P0 Matrix Badge -->
    <text x="800" y="2145" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#00F2FE" letter-spacing="3">[ 110 КЛЮЧЕВЫХ ЗАДВИЖЕК МАТРИЦЫ P0 • 5 ЭШЕЛОНОВ L1-L5 ]</text>

    <!-- Author Names -->
    <text x="800" y="2225" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="6">UNDRE &amp; ВАЛЕРА</text>
    <text x="800" y="2265" font-family="'PT Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#A0AEC0" letter-spacing="4">DIGITAL PLUMBER &amp; ZERO TRUST INVESTIGATOR</text>

    <!-- Technical spec bar -->
    <text x="800" y="2330" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#4A5568" letter-spacing="2">OPEN-SOURCE KNOWLEDGE BASE • ZERO-DRM CANONICAL RELEASE</text>
  </g>

</svg>
